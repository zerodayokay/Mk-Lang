name: Native Vulkan smoke

on:
  pull_request:
    paths:
      - '.github/workflows/graphics.yml'
      - 'std/gpu/**'
      - 'std/window/**'
      - 'std/task/**'
      - 'std/sys/linux/**'
      - 'std/sys/macos/**'
      - 'Dogfoods/scene/**'
      - 'Dogfoods/sketch/**'

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LLVM_VERSION: 21.1.8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Linux x86-64 toolchain and Vulkan dependencies
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          . /etc/os-release
          major=${LLVM_VERSION%%.*}
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fpr=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fpr" = 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          gpg --dearmor < "$RUNNER_TEMP/llvm.asc" | sudo tee /usr/share/keyrings/mk-graphics-llvm.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/mk-graphics-llvm.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$major main" |
            sudo tee /etc/apt/sources.list.d/mk-graphics-llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$major" "lld-$major" "llvm-$major" gdb libglfw3 libvulkan1 mesa-vulkan-drivers vulkan-validationlayers xvfb xauth
          echo "MK_LLVM=/usr/lib/llvm-$major/bin" >> "$GITHUB_ENV"

      - name: Linux ARM64 toolchain and Wayland dependencies
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          name="LLVM-$LLVM_VERSION-Linux-ARM64"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          echo '65ce0b329514e5643407db2d02a5bd34bf33d159055dafa82825c8385bd01993  llvm.tar.xz' | sha256sum -c -
          tar -xJf llvm.tar.xz
          rm -f llvm.tar.xz
          echo "MK_LLVM=$RUNNER_TEMP/$name/bin" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb libglfw3-wayland libvulkan1 mesa-vulkan-drivers weston xvfb xauth

      - name: Select lavapipe on Linux
        if: runner.os == 'Linux'
        run: |
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: macOS toolchain and MoltenVK
        if: runner.os == 'macOS'
        run: |
          name="LLVM-$LLVM_VERSION-macOS-ARM64"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          echo 'b95bdd32a33a81ee4d40363aaeb26728a26783fcef26a4d80f65457433ea4669  llvm.tar.xz' | shasum -a 256 -c -
          tar -xJf llvm.tar.xz
          echo "MK_LLVM=$RUNNER_TEMP/$name/bin" >> "$GITHUB_ENV"
          brew install glfw vulkan-loader molten-vk
          prefix=$(brew --prefix)
          echo "DYLD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          icd=$(find -L "$(brew --prefix molten-vk)" -name 'MoltenVK_icd.json' -print -quit)
          test -n "$icd"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Build scene and sketch
        run: |
          go build -o "$RUNNER_TEMP/mk" ./cmd/mk
          "$RUNNER_TEMP/mk" build Dogfoods/scene -o "$RUNNER_TEMP/scene"
          "$RUNNER_TEMP/mk" build Dogfoods/sketch -o "$RUNNER_TEMP/sketch"
          "$RUNNER_TEMP/sketch" check-script Dogfoods/sketch/cases/scripts/close.script

      - name: Cross-build scene and sketch for Intel macOS
        if: runner.os == 'macOS'
        run: |
          dir="$RUNNER_TEMP/intel-graphics"
          mkdir -p "$dir"
          "$RUNNER_TEMP/mk" build --target x86_64-macos Dogfoods/scene -o "$dir/scene"
          "$RUNNER_TEMP/mk" build --target x86_64-macos Dogfoods/sketch -o "$dir/sketch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: graphics-macos-x86_64
          path: |
            ${{ runner.temp }}/intel-graphics/scene
            ${{ runner.temp }}/intel-graphics/sketch
          if-no-files-found: error
          retention-days: 1

      - name: Check the macOS main-thread service
        if: runner.os == 'macOS'
        run: |
          "$RUNNER_TEMP/mk" test --timeout 15s --std std.task --run RT-MainThreadService

      - name: Check glibc thread joins on Linux
        if: runner.os == 'Linux'
        run: go test -p 1 -timeout 5m ./internal/driver -run '^TestFFI_JoinedThread$'

      - name: Validate rendering and present through X11 on Linux x86-64
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          run_native() {
            local rc=0
            "$RUNNER_TEMP/scene" "$@" || rc=$?
            if (( rc == 0 )); then
              return 0
            fi
            echo "::group::Linux Vulkan native backtrace"
            local debugger=(
              timeout 90s gdb -nx -batch
              -ex 'set print thread-events off'
              -ex 'handle SIGURG nostop noprint pass'
              -ex 'handle SIGPIPE nostop noprint pass'
              -ex run -ex bt -ex 'x/8i $pc' -ex 'info sharedlibrary'
            )
            "${debugger[@]}" --args "$RUNNER_TEMP/scene" "$@" || true
            if "$RUNNER_TEMP/mk" build --debug Dogfoods/scene -o "$RUNNER_TEMP/scene-debug"; then
              "${debugger[@]}" --args "$RUNNER_TEMP/scene-debug" "$@" || true
            fi
            echo "::endgroup::"
            return "$rc"
          }
          scene=Dogfoods/scene/cases/scenes/shadow.scene
          run_native probe --backend vulkan --list
          run_native render "$scene" "$RUNNER_TEMP/shadow.png" --backend vulkan --strict
          test -s "$RUNNER_TEMP/shadow.png"
          output=$(xvfb-run -a "$RUNNER_TEMP/scene" view "$scene" --backend vulkan --frames 3)
          printf '%s\n' "$output"
          grep -Fxq 'view: vulkan presented 3 frames' <<< "$output"

      - name: Render and present through Wayland on Linux ARM64
        if: runner.os == 'Linux' && runner.arch == 'ARM64'
        run: |
          xvfb-run -a bash --noprofile --norc -e <<'WAYLAND'
          runtime=$(mktemp -d "$RUNNER_TEMP/mk-wayland.XXXXXX")
          export XDG_RUNTIME_DIR="$runtime" WAYLAND_DISPLAY=mk-smoke
          log="$RUNNER_TEMP/weston.log"
          # The X11 backend provides the input seat required by Noble's GLFW.
          weston --backend=x11 --renderer=pixman --no-config --socket="$WAYLAND_DISPLAY" > "$log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true' EXIT
          unset DISPLAY
          for ((attempt=0; attempt<100; attempt++)); do
            if [ -S "$runtime/$WAYLAND_DISPLAY" ] || ! kill -0 "$weston_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          if [ ! -S "$runtime/$WAYLAND_DISPLAY" ]; then
            cat "$log"
            exit 1
          fi
          scene=Dogfoods/scene/cases/scenes/shadow.scene
          "$RUNNER_TEMP/scene" render "$scene" "$RUNNER_TEMP/shadow.png" --backend vulkan
          test -s "$RUNNER_TEMP/shadow.png"
          if ! output=$(timeout 90s "$RUNNER_TEMP/scene" view "$scene" --backend vulkan --frames 3); then
            printf '%s\n' "$output"
            cat "$log"
            echo "::group::ARM64 Wayland native backtrace"
            if "$RUNNER_TEMP/mk" build --debug Dogfoods/scene -o "$RUNNER_TEMP/scene-debug"; then
              timeout -k 5s 90s gdb -nx -batch \
                -ex 'set print thread-events off' \
                -ex 'handle SIGURG nostop noprint pass' \
                -ex 'handle SIGPIPE nostop noprint pass' \
                -ex run -ex 'bt 16' -ex 'x/8i $pc' -ex 'info sharedlibrary' \
                --args "$RUNNER_TEMP/scene-debug" view "$scene" --backend vulkan --frames 3 || true
            fi
            echo "::endgroup::"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -Fxq 'view: vulkan presented 3 frames' <<< "$output"
          WAYLAND

      - name: Render and present on macOS
        if: runner.os == 'macOS'
        run: |
          if [ "$(swift -e 'import Metal; print(MTLCopyAllDevices().count)')" = 0 ]; then
            echo 'The macOS host has no Metal device. The build ran, and rendering still needs a Metal host.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scene=Dogfoods/scene/cases/scenes/shadow.scene
          "$RUNNER_TEMP/scene" render "$scene" "$RUNNER_TEMP/shadow.png" --backend vulkan
          test -s "$RUNNER_TEMP/shadow.png"
          output=$("$RUNNER_TEMP/scene" view "$scene" --backend vulkan --frames 3)
          printf '%s\n' "$output"
          grep -Fxq 'view: vulkan presented 3 frames' <<< "$output"

  intel-metal:
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe for a Metal device on Intel macOS
        run: |
          devices=$(swift -e 'import Metal; for device in MTLCopyAllDevices() { print(device.name) }')
          if [ -z "$devices" ]; then
            echo 'The Intel macOS runner exposes no Metal device.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf 'Intel macOS Metal devices:\n%s\n' "$devices" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphics-macos-x86_64
          path: ${{ runner.temp }}/intel-graphics

      - name: Install Intel macOS Vulkan dependencies
        run: |
          brew install glfw vulkan-loader
          echo "DYLD_LIBRARY_PATH=$(brew --prefix glfw)/lib:$(brew --prefix vulkan-loader)/lib" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o MoltenVK-macos.tar https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
          echo 'f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e  MoltenVK-macos.tar' | shasum -a 256 -c -
          dir=MoltenVK/MoltenVK/dynamic/dylib/macOS
          tar -xf MoltenVK-macos.tar "$dir/MoltenVK_icd.json" "$dir/libMoltenVK.dylib"
          lipo "$dir/libMoltenVK.dylib" -verify_arch x86_64
          echo "VK_DRIVER_FILES=$RUNNER_TEMP/$dir/MoltenVK_icd.json" >> "$GITHUB_ENV"

      - name: Render and present on Intel macOS
        env:
          # Avoid the init-time argument-encoder probe on the virtual GPU.
          MVK_CONFIG_USE_METAL_ARGUMENT_BUFFERS: '0'
        run: |
          dir="$RUNNER_TEMP/intel-graphics"
          chmod +x "$dir/scene" "$dir/sketch"
          "$dir/sketch" check-script Dogfoods/sketch/cases/scripts/close.script
          run_native() {
            local rc=0
            "$dir/scene" "$@" || rc=$?
            if (( rc == 0 )); then
              return 0
            fi
            echo '::group::Intel macOS Vulkan native backtrace' >&2
            xcrun lldb --batch -o 'settings set target.disable-aslr false' \
              -o "settings set target.env-vars \"DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH\" \"VK_DRIVER_FILES=$VK_DRIVER_FILES\"" \
              -o run -k 'thread backtrace all' -- "$dir/scene" "$@" >&2 || true
            echo '::endgroup::' >&2
            return "$rc"
          }
          scene=Dogfoods/scene/cases/scenes/shadow.scene
          run_native probe --backend vulkan --list
          run_native render "$scene" "$RUNNER_TEMP/shadow.png" --backend vulkan
          test -s "$RUNNER_TEMP/shadow.png"
          output=$(run_native view "$scene" --backend vulkan --frames 3)
          printf '%s\n' "$output"
          grep -Fxq 'view: vulkan presented 3 frames' <<< "$output"
