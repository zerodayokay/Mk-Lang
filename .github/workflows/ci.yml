# Why: pull requests and pushes to main need fast, reliable feedback on both
# supported hosts without queuing behind GitHub's 20-job free concurrency
# limit, while release tags and nightly runs still need full non-short
# coverage across every host and target.
#
# What: two modes selected by the lightweight `plan` job:
#   - fast (default on pull_request, push to main, and default dispatch):
#     18 parallel jobs (< 20 concurrency limit, zero queue delay):
#       * checks (build, vet, gofmt, mk corpus) on ubuntu-24.04 & windows-2025
#       * compiler (-short tests for all non-driver/corpus/lsp/stdtest/bench
#         packages) on ubuntu-24.04 & windows-2025
#       * driver-0..11 (-short, 12 shards of internal/driver) on ubuntu-24.04
#       * driver-win-smoke (curated Windows-native driver suite, MK_GATE=1) on
#         windows-2025
#       * lsp (-short, internal/lsp) on ubuntu-24.04
#   - full (default for workflow_call from release.yml/nightly.yml, or manual
#     workflow_dispatch with mode=full):
#     the complete non-short matrix on every OS in inputs.oses (checks,
#     driver-0..7, corpus, lsp, others with only tools/bench in -short), plus
#     native macOS (Apple silicon & Intel) and AArch64 Linux jobs when
#     include_extra_hosts is true (or on manual full dispatch).
#
# How: runs with a read-only token and no secrets, so a pull request from a
# fork runs it as it is. A newer push to a pull request cancels the run it
# supersedes; runs on main always finish. tools/ci/test.sh runs each test
# job's part.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "fast (18-job PR/push suite) or full (every package + macOS/ARM64)"
        type: choice
        options: [fast, full]
        default: fast
  workflow_call:
    inputs:
      mode:
        description: "fast or full (defaults to full for release.yml and nightly.yml)"
        type: string
        default: full
      oses:
        description: JSON list of runner images to test on (full mode)
        type: string
        default: '["windows-2025", "ubuntu-24.04"]'
      include_extra_hosts:
        description: Also run macos (ARM64/Intel) and arm64-linux jobs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only a pull request's runs are cancelled: every commit on main keeps a
  # complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: 21.1.8
  # SHA-256 of LLVM-21.1.8-win64.exe, from the release's asset digest.
  LLVM_WIN64_SHA256: 7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113

jobs:
  plan:
    name: Plan CI matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
      extra_hosts: ${{ steps.plan.outputs.extra_hosts }}
    steps:
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OSES: ${{ inputs.oses }}
          INPUT_EXTRA_HOSTS: ${{ inputs.include_extra_hosts }}
        run: |
          python3 - <<'PY'
          import json, os

          event = os.environ.get("EVENT_NAME", "")
          mode = os.environ.get("INPUT_MODE", "").strip()
          if not mode:
              mode = "full" if event == "workflow_call" else "fast"
          if mode not in ("fast", "full"):
              raise SystemExit(f"unknown CI mode: {mode!r}")

          oses_raw = os.environ.get("INPUT_OSES", "").strip()
          oses = json.loads(oses_raw) if oses_raw else ["windows-2025", "ubuntu-24.04"]

          extra_raw = os.environ.get("INPUT_EXTRA_HOSTS", "").strip().lower()
          if extra_raw in ("true", "1", "yes"):
              extra_hosts = True
          elif extra_raw in ("false", "0", "no"):
              extra_hosts = False
          else:
              # Manual full dispatch runs macOS/ARM64 too; release.yml calls
              # workflow_call without include_extra_hosts and builds/tests
              # macOS/ARM64 in its own bundle jobs.
              extra_hosts = (mode == "full" and event != "workflow_call")

          if mode == "fast":
              entries = [
                  {"os": "ubuntu-24.04", "part": "checks", "mode": "fast", "shards": "12"},
                  {"os": "windows-2025", "part": "checks", "mode": "fast", "shards": "12"},
                  {"os": "ubuntu-24.04", "part": "compiler", "mode": "fast", "shards": "12"},
                  {"os": "windows-2025", "part": "compiler", "mode": "fast", "shards": "12"},
                  {"os": "windows-2025", "part": "driver-win-smoke", "mode": "fast", "shards": "12"},
                  {"os": "ubuntu-24.04", "part": "lsp", "mode": "fast", "shards": "12"},
              ]
              for i in range(12):
                  entries.append({
                      "os": "ubuntu-24.04",
                      "part": f"driver-{i}",
                      "mode": "fast",
                      "shards": "12",
                  })
          else:
              parts = [
                  "checks",
                  "driver-0", "driver-1", "driver-2", "driver-3",
                  "driver-4", "driver-5", "driver-6", "driver-7",
                  "corpus", "lsp", "others",
              ]
              entries = [
                  {"os": runner_os, "part": part, "mode": "full", "shards": "8"}
                  for runner_os in oses
                  for part in parts
              ]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"mode={mode}\n")
              out.write(f"matrix={json.dumps(entries, separators=(',', ':'))}\n")
              out.write(f"extra_hosts={'true' if extra_hosts else 'false'}\n")
          PY

  ci:
    needs: plan
    name: ${{ matrix.part }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ needs.plan.outputs.mode == 'full' && 150 || 60 }}
    defaults:
      run:
        # Git Bash on the hosted Windows images.
        shell: bash
    env:
      # MK_GATE=1 turns a test that cannot run here into a failure; only the
      # Windows jobs set it, since on Linux the Windows legs cannot run.
      MK_GATE: ${{ startsWith(matrix.os, 'windows') && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache: the module has no dependencies, and a restored build
      # cache would let `go test` report cached results.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache: false

      # A temporary directory and an mk cache of the job's own, so files
      # another program left in the image's temp directory never reach the
      # tests.
      - name: Temporary directory
        run: |
          tmp="$RUNNER_TEMP/tmp"
          cache="$RUNNER_TEMP/mkcache"
          mkdir -p "$tmp" "$cache"
          # Git Bash on Windows: native paths, not ones with mixed separators.
          if command -v cygpath >/dev/null; then
            tmp=$(cygpath -w "$tmp")
            cache=$(cygpath -w "$cache")
          fi
          echo "TMP=$tmp" >> "$GITHUB_ENV"
          echo "TEMP=$tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"
          echo "MK_CACHE=$cache" >> "$GITHUB_ENV"

      # The installer from LLVM's releases page, into the default location
      # mk searches. The image may carry another LLVM there: its uninstaller
      # finishes in the background, so wait for it to remove itself.
      - name: LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          llvm="/c/Program Files/LLVM"
          if [ -x "$llvm/Uninstall.exe" ]; then
            MSYS_NO_PATHCONV=1 "$llvm/Uninstall.exe" /S
            for _ in $(seq 120); do
              [ -e "$llvm/bin/clang.exe" ] || [ -e "$llvm/Uninstall.exe" ] || break
              sleep 5
            done
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-win64.exe"
          echo "$LLVM_WIN64_SHA256  llvm.exe" | sha256sum -c -
          MSYS_NO_PATHCONV=1 ./llvm.exe /S
          rm -f llvm.exe
          v=$("$llvm/bin/clang.exe" --version)
          echo "$v"
          case "$v" in
            *"clang version $LLVM_VERSION"*) ;;
            *) echo "::error::$llvm holds no clang $LLVM_VERSION"; exit 1 ;;
          esac

      # clang-21 and lld-21 from apt.llvm.org; mk finds them in
      # /usr/lib/llvm-21/bin. The repository's signing key is checked
      # against its fingerprint before apt trusts it.
      - name: LLVM (Linux)
        if: runner.os == 'Linux'
        env:
          LLVM_APT_KEY: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        run: |
          . /etc/os-release
          major=${LLVM_VERSION%%.*}
          curl -fsSL -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          fpr=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          if [ "$fpr" != "$LLVM_APT_KEY" ]; then
            echo "::error::apt.llvm.org's key has the fingerprint '$fpr', not $LLVM_APT_KEY"
            exit 1
          fi
          gpg --dearmor < "$RUNNER_TEMP/llvm.asc" | sudo tee /usr/share/keyrings/llvm.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-$major main" |
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-$major" "lld-$major" "llvm-$major"
          v=$("/usr/lib/llvm-$major/bin/clang" --version)
          echo "$v"
          case "$v" in
            *"clang version $LLVM_VERSION"*) ;;
            *) echo "::error::apt.llvm.org installed no clang $LLVM_VERSION"; exit 1 ;;
          esac

      - name: Toolchain
        run: |
          go version
          go run ./cmd/mk version

      - name: Build
        if: matrix.part == 'checks'
        run: go build ./...

      - name: Vet
        if: matrix.part == 'checks'
        run: go vet ./...

      - name: Format
        if: matrix.part == 'checks'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would change:"
            echo "$out"
            exit 1
          fi

      - name: Documentation tests
        if: matrix.part == 'checks'
        run: go run ./cmd/mk corpus

      - name: Test the standalone notes dogfood
        if: matrix.part == 'checks'
        working-directory: Dogfoods/notes
        run: go run ../../cmd/mk test

      - name: Test
        if: matrix.part != 'checks'
        env:
          PART: ${{ matrix.part }}
          CI_TIER: ${{ matrix.mode }}
          SHARD_COUNT: ${{ matrix.shards }}
          OTHER_P: ${{ matrix.mode == 'fast' && (startsWith(matrix.os, 'windows') && '3' || '4') || '2' }}
          # Well below timeout-minutes, so a hung test prints its stacks.
          TEST_TIMEOUT: ${{ matrix.mode == 'fast' && '45m' || '120m' }}
        run: |
          if [ "$CI_TIER" = "fast" ]; then
            export TEST_SHORT=1
          fi
          case "$PART" in
            driver-win-smoke)
              exec go test -short -v -p 1 -parallel 4 -timeout 30m \
                -run '^(TestBuildFizzWindows|TestBecome_PreserveNone.*|TestBecome_EmitsMustTail|TestBecome_Chains|TestCImport_EndToEndWindows|TestDebugPlacesPDB|TestDebugReuseCopiesPDB|TestDep_DiamondWorkspaceWindows|TestFFI_Entry|TestFFI_Wins|TestLibGate_Windows|TestLibHost_Windows|TestMutCaptureNativeRun|TestNativeWorkDirUnderCache|TestOmittedSubsystemAndWindowsLinksGUI|TestSliceCallerAgreesNative|TestWire_DeadlinesNative)$' \
                ./internal/driver
              ;;
            driver-*) export CI_MODE=driver SHARD_INDEX=${PART#driver-} ;;
            compiler) export CI_MODE=others EXCLUDE_PKGS="mk/internal/corpus mk/internal/lsp mk/internal/stdtest mk/tools/bench" ;;
            corpus) export CI_MODE=others PKGS=mk/internal/corpus ;;
            lsp) export CI_MODE=others PKGS=mk/internal/lsp ;;
            others) export CI_MODE=others EXCLUDE_PKGS="mk/internal/corpus mk/internal/lsp" SHORT_PKGS=mk/tools/bench ;;
            *) echo "unknown part $PART"; exit 1 ;;
          esac
          bash tools/ci/test.sh

  # macOS: the targets mk cross-compiles everywhere, built and run natively
  # on GitHub's hosted Macs (Apple silicon for aarch64-macos, Intel for
  # x86_64-macos). Runs in nightly full CI and manual mode=full dispatches,
  # keeping PRs fast and well under GitHub's hosted concurrency caps.
  macos:
    needs: plan
    name: ${{ matrix.part }} (${{ matrix.os }})
    if: needs.plan.outputs.extra_hosts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        part: [checks, std, programs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # SHA-256 of LLVM-21.1.8-macOS-ARM64.tar.xz, from the release's asset
      # digest. LLVM publishes no x86_64 macOS archive of 21.1.8, so the
      # Intel job takes Homebrew's llvm@21, whose bottle brew checks, and
      # checks the version.
      LLVM_MACOS_ARM64_SHA256: b95bdd32a33a81ee4d40363aaeb26728a26783fcef26a4d80f65457433ea4669
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache: false

      - name: Temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/mkcache"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "MK_CACHE=$RUNNER_TEMP/mkcache" >> "$GITHUB_ENV"

      - name: LLVM (Apple silicon)
        if: runner.arch == 'ARM64'
        run: |
          cd "$RUNNER_TEMP"
          name="LLVM-$LLVM_VERSION-macOS-ARM64"
          curl -fsSL --retry 3 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          echo "$LLVM_MACOS_ARM64_SHA256  llvm.tar.xz" | shasum -a 256 -c -
          tar -xJf llvm.tar.xz
          rm -f llvm.tar.xz
          echo "MK_LLVM=$RUNNER_TEMP/$name/bin" >> "$GITHUB_ENV"

      # Homebrew ships lld apart from llvm, and mk takes clang and the
      # linker from one directory, so both are linked into one.
      - name: LLVM (Intel)
        if: runner.arch == 'X64'
        run: |
          brew install llvm@21
          brew install lld@21 || brew install lld
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          for tool in clang ld.lld ld64.lld lld lld-link llvm-lib; do
            for dir in "$(brew --prefix llvm@21)/bin" "$(brew --prefix lld@21 2>/dev/null)/bin" "$(brew --prefix lld 2>/dev/null)/bin"; do
              if [ -x "$dir/$tool" ]; then
                ln -sf "$dir/$tool" "$bin/$tool"
                break
              fi
            done
          done
          ls -l "$bin"
          echo "MK_LLVM=$bin" >> "$GITHUB_ENV"

      - name: Toolchain
        env:
          WANT: ${{ runner.arch == 'ARM64' && '21.1.8' || '21.' }}
        run: |
          v=$("$MK_LLVM/clang" --version)
          echo "$v"
          case "$v" in
            *"clang version $WANT"*) ;;
            *) echo "::error::$MK_LLVM holds no clang $WANT"; exit 1 ;;
          esac
          [ -x "$MK_LLVM/ld64.lld" ] || [ -x "$MK_LLVM/lld" ] || { echo "::error::no ld64.lld or lld in $MK_LLVM"; exit 1; }
          go version
          go run ./cmd/mk version

      - name: Build
        if: matrix.part == 'checks'
        run: |
          go build ./...
          go vet ./...

      - name: Documentation tests
        if: matrix.part == 'checks'
        run: go run ./cmd/mk corpus -j 3

      - name: Mach-O tests
        if: matrix.part == 'checks'
        run: go test -p 2 -timeout 30m ./internal/toolchain ./internal/driver -run 'MachO|TBD|FormatOfMacOS|TestStdTargetMissing|TestAArch64'

      # The Go harnesses judge std's blocks as the gate does: a name's
      # "[exit N: text]" and "[env K=V]" are honoured there, not by a bare
      # mk test. The host's own target runs natively, dev profile.
      - name: std tests
        if: matrix.part == 'std'
        env:
          TARGET: ${{ runner.arch == 'ARM64' && 'aarch64-macos' || 'x86_64-macos' }}
        run: |
          go test -p 2 -timeout 100m ./internal/stdtest -run "^TestStdMkTests$/^$TARGET$/^dev$"
          go test -p 2 -timeout 100m ./internal/driver -run "^TestStdRuntimeTests$/^$TARGET$"

      - name: Programs
        if: matrix.part == 'programs'
        env:
          # coderegion runs x86-64 machine code and needs std.vm's code
          # regions; linuxsyscall is Linux's raw system call.
          SKIP_PROGRAMS: coderegion linuxsyscall
        run: bash tools/ci/programs.sh

  # aarch64-linux, natively on GitHub's hosted ARM runner. Runs in nightly
  # full CI and manual mode=full dispatches.
  arm64-linux:
    needs: plan
    name: ${{ matrix.part }} (${{ matrix.os }})
    if: needs.plan.outputs.extra_hosts == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        part: [checks, std, programs]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # SHA-256 of LLVM-21.1.8-Linux-ARM64.tar.xz, from the release's asset
      # digest. apt.llvm.org's arm64 packages are not pinned to one point
      # release, so the official archive is used here.
      LLVM_LINUX_ARM64_SHA256: 65ce0b329514e5643407db2d02a5bd34bf33d159055dafa82825c8385bd01993
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache: false

      - name: Temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/tmp" "$RUNNER_TEMP/mkcache"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
          echo "MK_CACHE=$RUNNER_TEMP/mkcache" >> "$GITHUB_ENV"

      - name: LLVM
        run: |
          cd "$RUNNER_TEMP"
          name="LLVM-$LLVM_VERSION-Linux-ARM64"
          curl -fsSL --retry 3 -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$name.tar.xz"
          echo "$LLVM_LINUX_ARM64_SHA256  llvm.tar.xz" | sha256sum -c -
          tar -xJf llvm.tar.xz
          rm -f llvm.tar.xz
          echo "MK_LLVM=$RUNNER_TEMP/$name/bin" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          v=$("$MK_LLVM/clang" --version)
          echo "$v"
          case "$v" in
            *"clang version $LLVM_VERSION"*) ;;
            *) echo "::error::$MK_LLVM holds no clang $LLVM_VERSION"; exit 1 ;;
          esac
          go version
          go run ./cmd/mk version

      - name: Build
        if: matrix.part == 'checks'
        run: |
          go build ./...
          go vet ./...

      - name: Documentation tests
        if: matrix.part == 'checks'
        run: go run ./cmd/mk corpus -j 3

      - name: AArch64 and Mach-O tests
        if: matrix.part == 'checks'
        run: go test -p 2 -timeout 30m ./internal/toolchain ./internal/driver -run 'MachO|TBD|FormatOfMacOS|TestStdTargetMissing|TestAArch64'

      # System-libc mode and libraries, built for aarch64-linux and run
      # natively: the FFI tests build for the host's Linux target, and
      # MK_LINUX=1 runs what they build.
      - name: System-libc and library tests
        if: matrix.part == 'checks'
        env:
          MK_LINUX: '1'
        run: go test -p 2 -timeout 60m ./internal/driver -run 'TestFFI_(Entry|Versions|Libm|Threads|Runtime|CMix|ExternVar|DlSearch|NoExports|CAddr|FabsHint|StaticThreads|LibcBuildCache|DirectRefs|DirectRefsAArch64|LinuxLibcExample)$|TestLibGate_Linux|TestLibOutput_LinuxShared|TestLibHeader'

      # The Go harnesses judge std's blocks as the gate does: a name's
      # "[exit N: text]" and "[env K=V]" are honoured there, not by a bare
      # mk test. The host's own target runs natively, dev profile.
      - name: std tests
        if: matrix.part == 'std'
        env:
          TARGET: aarch64-linux
        run: |
          go test -p 2 -timeout 100m ./internal/stdtest -run "^TestStdMkTests$/^$TARGET$/^dev$"
          go test -p 2 -timeout 100m ./internal/driver -run "^TestStdRuntimeTests$/^$TARGET$"

      - name: Programs
        if: matrix.part == 'programs'
        env:
          # coderegion runs x86-64 machine code; linuxsyscall uses x86_64's
          # system-call numbers through std.linux.
          SKIP_PROGRAMS: coderegion linuxsyscall
        run: bash tools/ci/programs.sh
